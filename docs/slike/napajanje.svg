<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 515" width="1080" height="515" role="img" aria-label="Baterija 18650 ide na B+ i B- punjaca TP4056. OUT+ ide preko prekidaca na ulaz step-upa. Izlaz step-upa od 5 V napaja ESP32-C3 i DFPlayer, uz kondenzatore 470 uF i 100 nF kod DFPlayera. Sa ulaza step-upa delitelj 2 x 100 kOhm daje pola napona baterije na GPIO3. Sve mase su zajednicke."><rect width="1080" height="515" rx="14" fill="#ffffff"/><text x="28" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#18221f" text-anchor="start">Napajanje</text><polyline points="140,150 200,150" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#e8731a" stroke-width="7"/><polyline points="140,240 200,240" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#7a4a26" stroke-width="7"/><polyline points="330,150 386,150" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#e8731a" stroke-width="7"/><polyline points="444,150 560,150" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#e8731a" stroke-width="7"/><polyline points="330,240 362,240 362,400" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#7a4a26" stroke-width="7"/><polyline points="560,240 536,240 536,400" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#7a4a26" stroke-width="7"/><polyline points="690,240 716,240 716,400" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#7a4a26" stroke-width="7"/><polyline points="690,150 750,150 750,80 830,80" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#e8731a" stroke-width="5"/><polyline points="750,150 750,230 830,230" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#e8731a" stroke-width="7"/><polyline points="1010,125 1040,125 1040,400" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#7a4a26" stroke-width="5"/><polyline points="1010,320 1040,320" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#7a4a26" stroke-width="7"/><polyline points="362,400 1040,400" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#7a4a26" stroke-width="7"/><polyline points="500,150 500,400" fill="none" stroke="#18221f" stroke-width="2"/><rect x="492" y="182.5" width="16" height="40" rx="3" fill="#ffffff" stroke="#18221f" stroke-width="2"/><text x="486" y="207.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="end">100 kΩ</text><rect x="492" y="305.0" width="16" height="40" rx="3" fill="#ffffff" stroke="#18221f" stroke-width="2"/><text x="486" y="330.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="end">100 kΩ</text><circle cx="500" cy="258" r="5" fill="#18221f"/><polyline points="500,258 468,258" fill="none" stroke="#18221f" stroke-width="2"/><text x="462" y="263" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#18221f" text-anchor="end">GPIO3</text><polyline points="790,230 790,300" fill="none" stroke="#18221f" stroke-width="2"/><polyline points="790,312 790,400" fill="none" stroke="#18221f" stroke-width="2"/><line x1="776" y1="300" x2="804" y2="300" stroke="#18221f" stroke-width="3"/><line x1="776" y1="312" x2="804" y2="312" stroke="#18221f" stroke-width="3"/><text x="770" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="end">470 µF</text><text x="770" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="end">+ 100 nF</text><circle cx="750" cy="150" r="5.5" fill="#e8731a"/><circle cx="500" cy="150" r="5.5" fill="#e8731a"/><circle cx="790" cy="230" r="5.5" fill="#e8731a"/><circle cx="362" cy="400" r="5.5" fill="#7a4a26"/><circle cx="500" cy="400" r="5.5" fill="#7a4a26"/><circle cx="536" cy="400" r="5.5" fill="#7a4a26"/><circle cx="716" cy="400" r="5.5" fill="#7a4a26"/><circle cx="790" cy="400" r="5.5" fill="#7a4a26"/><circle cx="1040" cy="320" r="5.5" fill="#7a4a26"/><rect x="30" y="120" width="110" height="150" rx="10" fill="#ffffff" stroke="#18221f" stroke-width="2"/><text x="85.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#18221f" text-anchor="middle">18650</text><text x="85.0" y="211.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="middle">3,0–4,2 V</text><text x="128" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18221f" text-anchor="end">+</text><text x="128" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18221f" text-anchor="end">−</text><rect x="200" y="120" width="130" height="150" rx="10" fill="#ffffff" stroke="#18221f" stroke-width="2"/><text x="265.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#18221f" text-anchor="middle">TP4056</text><text x="265.0" y="211.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="middle">punjač i</text><text x="265.0" y="228.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="middle">zaštita</text><text x="208" y="145" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="start">B+</text><text x="208" y="258" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="start">B−</text><text x="322" y="145" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="end">OUT+</text><text x="322" y="258" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="end">OUT−</text><line x1="265" y1="70" x2="265" y2="108" stroke="#e8731a" stroke-width="3"/><polygon points="257,106 273,106 265,118" fill="#e8731a"/><text x="278" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="start">USB-C, punjenje</text><text x="170" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6964" text-anchor="middle">minus baterije</text><text x="170" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5a6964" text-anchor="middle">samo na B−</text><circle cx="390" cy="150" r="5" fill="#fff" stroke="#18221f" stroke-width="2"/><circle cx="440" cy="150" r="5" fill="#fff" stroke="#18221f" stroke-width="2"/><line x1="394" y1="147" x2="434" y2="124" stroke="#18221f" stroke-width="3" stroke-linecap="round"/><text x="415" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#18221f" text-anchor="middle">prekidač</text><text x="415" y="200" font-family="Consolas, Menlo, monospace" font-size="13" font-weight="400" fill="#5a6964" text-anchor="middle">KCD1</text><rect x="560" y="120" width="130" height="150" rx="10" fill="#ffffff" stroke="#18221f" stroke-width="2"/><text x="625.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#18221f" text-anchor="middle">Step-up</text><text x="625.0" y="211.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="middle">izlaz podesi</text><text x="625.0" y="228.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="middle">na 5,0 V</text><text x="568" y="145" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="start">IN+</text><text x="568" y="258" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="start">IN−</text><text x="682" y="145" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="end">OUT+</text><text x="682" y="258" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="end">OUT−</text><rect x="830" y="50" width="180" height="100" rx="10" fill="#ffffff" stroke="#18221f" stroke-width="2"/><text x="920.0" y="94.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#18221f" text-anchor="middle">ESP32-C3</text><text x="920.0" y="116.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="middle">3V3 → RC522</text><text x="838" y="74" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="start">5V</text><text x="1002" y="130" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="end">G</text><rect x="830" y="200" width="180" height="140" rx="10" fill="#ffffff" stroke="#18221f" stroke-width="2"/><text x="920.0" y="264.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#18221f" text-anchor="middle">DFPlayer Mini</text><text x="920.0" y="286.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="middle">SPK_1, SPK_2</text><text x="920.0" y="303.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5a6964" text-anchor="middle">→ zvučnik</text><text x="838" y="224" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="start">VCC</text><text x="1002" y="325" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5a6964" text-anchor="end">GND</text><text x="700" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5a6964" text-anchor="middle">zajednička masa (GND)</text><text x="28" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5a6964" text-anchor="start">Narandžasta žica je plus, braon je masa. Deblja linija su dve žice iz UTP kabla zajedno, jer jedna žica (0,5 mm) je tanka za struju zvučnika.</text><text x="28" y="492" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5a6964" text-anchor="start">Delitelj (2 × 100 kΩ) je posle prekidača, pa ne prazni bateriju dok je radio ugašen.</text></svg>

; Figurica radio - muzicka igracka sa NFC figuricama
;
; Platforma je pioarduino 55.03.311 = Arduino core 3.3.11. Prvi build je spor
; jer prevodi celo Arduino jezgro; kes ispod cuva prevedeno jezgro, pa su
; sledeci build-ovi brzi (i za druge projekte sa istom platformom).

[platformio]
default_envs = esp32c3
build_cache_dir = ${platformio.core_dir}/build_cache

; ESP32-C3 SuperMini. USB CDC zastavice su obavezne: C3 nema zaseban
; USB-serial cip, pa bez njih Serial ide na UART0 i monitor ostaje prazan.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
monitor_echo = yes
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    dfrobot/DFRobotDFPlayerMini@^1.0.6
build_flags =
    -Wall
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Radio.
[env:esp32c3]
build_src_filter = +<*> -<ModuleTest.cpp>

; Proba modula bez RFID citaca i bez SD kartice: enkoder, taster, veza sa
; DFPlayerom i baterija. Vidi ModuleTest.cpp.
;   pio run -e proba -t upload
[env:proba]
build_src_filter = +<*> -<main.cpp> -<TagReader.cpp> -<Player.cpp> -<LearnedTags.cpp>
